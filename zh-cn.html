<!DOCTYPE html>
<html lang="zh-Hans-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 双板／单板教学</title>
<style>
body{margin:0;background:#0f1419;color:#e6edf3;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 20px}
h1{font-size:22px;margin:0 0 4px}
p{color:#8b98a5;margin:0 0 24px}
a.card{display:block;background:#171e26;border:1px solid #2a3440;border-radius:12px;padding:16px 18px;margin-bottom:12px;color:inherit;text-decoration:none}
a.card:hover{border-color:#4cc9f0}
a.card b{font-size:17px;color:#4cc9f0}
a.card span{display:block;color:#8b98a5;font-size:13px;margin-top:4px}
</style>
</head>
<body>
<main>
  <select id="langSel" aria-label="Language" style="float:right;margin-left:8px;background:#171e26;color:#e6edf3;border:1px solid #2a3440;border-radius:8px;padding:4px 6px;font-size:12px"><option value="index.html">廣東話（香港）</option><option value="zh-tw.html">繁體中文（台灣）</option><option value="zh-cn.html" selected>简体中文（中国大陆）</option><option value="en.html">English</option></select>
  <h1>3D 双板／单板教学</h1>
  <p>交互 3D 模型：肌肉发力（向心／离心／等长）、重心、立刃、脚掌压力，可以 360° 旋转。</p>
  <a class="card" href="ski/zh-cn.html"><b>双板 Ski</b><span>犁式・平行式・刻滑・猫跳・小回转・侧滑转向・斜滑降＋Garland・提内脚练习</span></a>
  <a class="card" href="snowboard/zh-cn.html"><b>单板 Snowboard</b><span>推坡・斜滑降＋Garland・搓雪・动态・刻滑・低姿态刻滑・豚跳 Ollie／Nollie・平花 Butter・反脚 Switch</span></a>
</main>
<script>
(function(){
  var file = location.pathname.split('/').pop() || 'index.html';
  var sel = document.getElementById('langSel');
  if (sel) sel.onchange = function(){ try { localStorage.setItem('lang', sel.value); } catch(e){} location.href = sel.value; };
  if (file !== 'index.html' && file !== '') return;
  var saved = null; try { saved = localStorage.getItem('lang'); } catch(e){}
  var target = saved;
  if (!target){
    var l = (navigator.language || '').toLowerCase();
    if (/^zh-(hk|mo)/.test(l) || /yue/.test(l)) target = 'index.html';
    else if (/^zh-(tw|hant)/.test(l)) target = 'zh-tw.html';
    else if (/^zh/.test(l)) target = 'zh-cn.html';
  }
  if (target && target !== 'index.html') location.replace(target);
})();
</script>
</body>
</html>
