<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 健身動作參考：肌肉・節奏・正確 vs 錯誤</title>
<style>
:root{--bg:#0f1419;--panel:#171e26;--line:#2a3440;--text:#e6edf3;--muted:#8b98a5;--accent:#4cc9f0;--good:#3ddc84;--warn:#ffb020;--con:#3ddc84;--ecc:#ff4d6d;--iso:#4cc9f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{padding:12px 16px 8px;max-width:900px;margin:0 auto}
h1{font-size:17px;margin:0}
header p{margin:2px 0 0;color:var(--muted);font-size:12px}
#stage{position:relative;height:58vh;min-height:330px;max-height:640px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#cfdbe6;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;top:8px;left:8px;z-index:2;background:rgba(15,20,25,.86);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none;max-width:70%;line-height:1.45}
.hud b{font-size:14px;color:var(--accent)}
.cmp .hud{max-width:47%;font-size:11px;padding:4px 7px}.cmp .hud b{font-size:12px}
#phaseBar{height:5px;background:#26303a;border-radius:3px;margin-top:5px;overflow:hidden}#phaseBar i{display:block;height:100%;width:0}
.cmpLbl{position:absolute;bottom:8px;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:600;pointer-events:none;display:none;max-width:48%}
#lblL{left:8px;background:rgba(61,220,132,.92);color:#0f1419}#lblR{right:8px;background:rgba(255,77,109,.94);color:#fff}
#divider{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#0f1419;display:none}
.hint{position:absolute;bottom:8px;right:8px;color:#3b4a58;font-size:10px;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3b4a58;font-size:13px;pointer-events:none}
main{padding:12px 16px 28px;max-width:900px;margin:0 auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%}
.seg button{padding:8px 2px;font-size:12px}
.seg button.on{background:var(--accent);color:#0f1419;font-weight:600}
.wrap{display:flex;flex-wrap:wrap;gap:6px}.wrap button{font-size:12px;padding:6px 9px}
.wrap button.on{background:var(--accent);color:#0f1419;font-weight:600}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 6px}
.card p{margin:4px 0;color:#c9d3dc}
.note{color:var(--muted)!important;font-size:12px}
.key{font-size:14px;padding:8px 10px;border-radius:8px;background:rgba(255,210,63,.1);border:1px solid rgba(255,210,63,.35)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:12px}
td small{display:block;color:var(--muted);font-size:11px;line-height:1.3}
.mode{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;white-space:nowrap}
.m-con{color:#0f1419;background:var(--con)}.m-ecc{color:#fff;background:var(--ecc)}.m-iso{color:#0f1419;background:var(--iso)}.m-off{color:var(--muted);background:#26303a}
.dots{letter-spacing:1px;color:var(--warn);white-space:nowrap}.dots i{color:#3a4652;font-style:normal}
.delta{color:var(--ecc);font-size:11px;font-weight:600}.delta.dn{color:var(--muted)}
ol.how{margin:4px 0 6px 18px;padding:0}ol.how li{margin:3px 0;color:#c9d3dc}
.tips p{padding-left:2px}
.sport{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start}
.sport b{white-space:nowrap}
.disc{color:var(--muted);font-size:11px;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>🏋️ 3D 健身動作參考</h1>
  <p>器械同滑雪／單板輔助動作：邊條肌肉發力、向心／離心／等長、節奏、正確 vs 錯誤</p>
</header>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="divider"></div>
  <div class="hud" id="hud"></div>
  <div class="cmpLbl" id="lblL">✅ 正確</div>
  <div class="cmpLbl" id="lblR"></div>
  <div id="loading">載入 3D 模型中…</div>
  <div class="hint">拖動旋轉・雙指縮放</div>
</div>

<main>
  <div class="row">
    <button id="play">⏸ 暫停</button>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <button id="musBtn" class="on">💪 肌肉</button>
  </div>
  <div class="seg" id="views" style="grid-template-columns:repeat(5,1fr)">
    <button data-v="side" class="on">側面</button><button data-v="diag">斜</button><button data-v="front">正面</button><button data-v="back">後面</button><button data-v="top">上面</button>
  </div>

  <div class="card">
    <div class="seg" id="cats" style="grid-template-columns:repeat(5,1fr)"></div>
    <div class="wrap" id="moves" style="margin-top:10px"></div>
  </div>

  <div class="card" id="tempoCard">
    <h2>⏱ 節奏</h2>
    <div class="seg" id="tempos" style="grid-template-columns:repeat(3,1fr)"></div>
    <p id="tempoTxt"></p>
  </div>

  <div class="card">
    <h2>⇆ 正確 vs 錯誤</h2>
    <div class="wrap" id="mis"></div>
    <p id="misWhy" class="key" style="display:none;margin-top:8px"></p>
  </div>

  <div class="card">
    <h2>💪 邊度發力</h2>
    <p class="note"><span class="mode m-con">向心</span> 肌肉縮短發力・<span class="mode m-ecc">離心</span> 肌肉拉長仲要控制・<span class="mode m-iso">等長</span> 長度唔變撐住・●●● 越多越主力</p>
    <table><thead><tr><th>肌肉</th><th>主力</th><th>而家</th></tr></thead><tbody id="musList"></tbody></table>
  </div>

  <div class="card">
    <h2>📋 點做</h2>
    <p id="gear" class="note"></p>
    <ol class="how" id="how"></ol>
    <p id="refs" class="note"></p>
    <div class="tips">
      <p id="tDo"></p><p id="tDont"></p><p id="tStop"></p><p id="tNote" class="note"></p>
    </div>
  </div>

  <div class="card">
    <h2>⛷️🏂 滑雪點用得著</h2>
    <div class="sport"><b>⛷️ 雙板</b><span id="skiTxt"></span><b>🏂 單板</b><span id="sbTxt"></span></div>
  </div>

  <p class="disc">⚠️ 肌肉發力係根據運動生物力學原理做嘅示意（相對值），唔係實測 EMG。公仔動作係程式產生嘅理想化示範，用嚟理解做法同錯誤，唔係醫療或者復康建議；有痛就停，有傷患請先問醫生或者物理治療師。</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="rig.js"></script>
<script>
(() => {
const D = Math.PI/180, V = THREE.Vector3, Q = THREE.Quaternion;
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = u => u*u*(3 - 2*u);

/* ================= data ================= */
const MUS = {
  quads:'股四頭肌 Quads', hams:'腿後腱 Hamstrings', glutes:'臀大肌 Glute max', abductors:'臀中肌 Glute med',

  midback:'中背 Rhomboids', traps:'上斜方肌 Upper traps', delts:'三角肌 Delts', rearDelts:'後三角肌 Rear delts',

};
const TEMPO = {

};
const PH = {con:['向心','m-con','🟢 發力（向心）・呼氣'], ecc:['離心','m-ecc','🔴 返回（離心）・吸氣・控制住'], iso:['等長','m-iso','🔵 停住（等長）'], rest:['放鬆','m-off','放鬆・準備下一下'], air:['騰空','m-off','騰空']};

// pose shorthand: leg/arm apply to both sides; L/R/aL/aR override
const BASE = {psi:0, roll:0, yaw:0, t:0, l:0, ty:0, hy:0, pt:0, hp:0, clav:0, fr:0, lift:0, off:[0,0,0],
  L:{th:[0,4], sh:[0,4], ft:null, fy:0, kin:0, ak:null, akx:0, aw:null, bend:null, foot:null, raise:0}, R:{th:[0,4], sh:[0,4], ft:null, fy:0, kin:0, ak:null, akx:0, aw:null, bend:null, foot:null, raise:0},
  aL:{ar:[0,8], fa:[10,8]}, aR:{ar:[0,8], fa:[10,8]}};
const clone = o => JSON.parse(JSON.stringify(o));
function P(o){
  const p = clone(BASE);
  for (const k in o){
    if (k === 'leg'){ Object.assign(p.L, clone(o.leg)); Object.assign(p.R, clone(o.leg)); }
    else if (k === 'arm'){ Object.assign(p.aL, clone(o.arm)); Object.assign(p.aR, clone(o.arm)); }
    else if (['L','R','aL','aR'].includes(k)) Object.assign(p[k], clone(o[k]));
    else p[k] = clone(o[k]);
  }
  for (const k of ['leg','arm']) if (o[k]) delete p[k];
  return p;
}
function mirror(p){
  const m = clone(p);
  [m.L, m.R] = [clone(p.R), clone(p.L)]; [m.aL, m.aR] = [clone(p.aR), clone(p.aL)];
  m.l = -p.l; m.ty = -p.ty; m.hy = -p.hy; m.roll = -p.roll; m.yaw = -p.yaw; m.off = [p.off[0], p.off[1], -p.off[2]];
  if (p.anchor === 'L') m.anchor = 'R'; else if (p.anchor === 'R') m.anchor = 'L';
  return m;
}
const QUAD0 = P({sup:'floor', psi:-90, leg:{th:[90,6], sh:[0,6], ft:0}, arm:{ar:[90,6], fa:[90,6]}});

const SEATED = {sup:'seat', y0:.5, leg:{th:[95,6], sh:[0,6]}};

  // ankles ride a 45° sled line (forward, up from the hip joint); knees ~105° at the bottom, almost straight at the top
  A: P({sup:'seat', y0:.55, psi:45, leg:{ak:[.43,.27], akx:.05, ft:180}, arm:{ar:[0,24], fa:[12,20]}}),

  mus:{quads:[3], glutes:[2], adductors:[1], hams:[1], calves:[1,'iso'], core:[1,'iso']},
  how:['調座位：背同臀貼實椅背，雙腳放踏板中間，與肩同寬，腳尖微向外','起始：膝微屈，唔好鎖死','落：吸氣，慢慢屈膝約 3 秒，落到大腿接近與地面平行，下背唔好離開椅背','推：呼氣，用成隻腳掌（特別係腳踭）推，推到膝近伸直但唔鎖死'],

  mis:[{name:'膝內扣', why:'推嗰下膝向內塌，膝內側受壓，臀中肌冇幫手。跟住腳尖方向推。', d:{kneeIn:16}, mark:'knee', view:'over', mus:{abductors:-1, adductors:1}},
       {name:'腰離開椅背', why:'落得太深，盆骨捲起、下背離椅。減細幅度，下背貼實。', d:{deepCurl:1}, mark:'pelvis', mus:{erec:1}}],
  ski:'外腳承重嘅主力：彎中股四頭肌同臀大肌要頂住離心力（離心＋等長）。腿推練基礎力量，令你屈膝都撐得住。',

        setCylAB(d1, h.clone().addScaledVector(ax, -.13), h.clone().addScaledVector(ax, -.08), .05); setCylAB(d2, h.clone().addScaledVector(ax, .08), h.clone().addScaledVector(ax, .13), .05); }); }
    if (k === 'wallFront'){ const w = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), M_WALL); w.position.set(0, 1.2, o.ankleL.z + .26); w.rotation.y = Math.PI; propG.add(w); }
    if (k === 'wallBack'){ const z = Math.min(o.shL.z, o.shR.z, pc.z) - .13; const w = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), M_WALL); w.position.set(0, 1.2, z); propG.add(w); }
    if (k === 'copBench'){ const aL = o.ankleL, kL = o.kneeL; const c = aL.clone().lerp(kL, .3); const top = c.y - .07;
      const pad = addBox(M_PAD); setBox(pad, new V(c.x, top - .03, c.z), UP, FWD, .5, .06, .32);
      const leg1 = addBox(M_FRAME); setBox(leg1, new V(c.x + .22, (top - .06)/2, c.z), UP, FWD, .05, top - .06, .28); }
    if (k === 'marks'){ for (const x of [-.55, .55]){ const mk = addBox(M_BAND, false); setBox(mk, new V(x, .004, 0), UP, FWD, .26, .006, .12); } }

}

/* ================= camera ================= */
let fitBox = null;
function fitCam(){
  if (!fitBox) return;
  const size = fitBox.getSize(new V()), asp = Math.max(.4, (stage.clientWidth/(cmpOn ? 2 : 1))/stage.clientHeight), tf = Math.tan(19*D);
  const halfH = size.y/2 + .08, halfW = Math.max(size.x, size.z)/2 + .08;
  dist = clamp(Math.max(halfH/tf, halfW/(tf*asp))*1.2 + .45, 2.2, 9);
}
const VIEWS = {side:[90, 10], diag:[40, 14], front:[0, 8], back:[180, 10], top:[20, 68], over:[195, 48], hi:[32, 30]};
let az = 90, el = 12, dist = 3.6, target = new V(0, .8, 0), viewKey = 'side';
function setView(v){ viewKey = v; [az, el] = VIEWS[v]; document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
function placeCam(aspect){
  camera.aspect = aspect; camera.updateProjectionMatrix();
  const a = az*D, e = el*D;
  camera.position.set(target.x + dist*Math.cos(e)*Math.sin(a), target.y + dist*Math.sin(e), target.z + dist*Math.cos(e)*Math.cos(a));
  camera.lookAt(target);
}
{ let drag = null, pinch = null;
  cv.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, az, el}; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (!drag || pinch) return; az = drag.az - (e.clientX - drag.x)*.4; el = clamp(drag.el + (e.clientY - drag.y)*.3, -5, 85); });
  cv.addEventListener('pointerup', () => drag = null);
  cv.addEventListener('wheel', e => { e.preventDefault(); dist = clamp(dist*(1 + e.deltaY*.001), 1.4, 8); }, {passive:false});
  cv.addEventListener('touchstart', e => { if (e.touches.length === 2){ pinch = {d:Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), dist}; drag = null; } }, {passive:true});
  cv.addEventListener('touchmove', e => { if (pinch && e.touches.length === 2){ const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); dist = clamp(pinch.dist*pinch.d/d, 1.4, 8); } }, {passive:true});
  cv.addEventListener('touchend', () => { pinch = null; });
}

/* ================= marks ================= */
const markMesh = new THREE.Mesh(new THREE.TorusGeometry(.11, .012, 8, 32), new THREE.MeshBasicMaterial({color:0xff2d55, depthTest:false}));
markMesh.renderOrder = 20; markG.add(markMesh);
function placeMark(mark, o, g){
  markMesh.visible = !!mark;
  if (!mark) return;
  const sm = o.shL.clone().add(o.shR).multiplyScalar(.5);
  const pos = {knee:o.kneeL.clone().add(o.kneeR).multiplyScalar(.5), pelvis:g.T.clone(), trunk:g.T.clone().lerp(sm, .55), shoulder:sm.clone().add(new V(0, .05, 0)),
    elbow:o.elL.clone().add(o.elR).multiplyScalar(.5), foot:o.ankleL.clone().add(o.ankleR).multiplyScalar(.5), head:o.head}[mark];
  if (!pos){ markMesh.visible = false; return; }
  markMesh.position.copy(pos); markMesh.quaternion.copy(camera.quaternion);
  const s = mark === 'trunk' || mark === 'pelvis' ? 1.6 : mark === 'knee' ? 1.6 : 1.1; markMesh.scale.setScalar(s);

/* ================= UI ================= */
let playing = true, clock = 0, last = performance.now(), tl = null, showMus = true, ready = false;

let catKey = 'mach';
function renderMoves(){
  document.querySelectorAll('[data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === catKey));
  $('moves').innerHTML = Object.entries(MOVES).filter(([, m]) => m.cat === catKey).map(([k, m]) => `<button data-m="${k}" class="${k === curId ? 'on' : ''}">${m.name}</button>`).join('');
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => setMove(b.dataset.m));
}
document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { catKey = b.dataset.c; renderMoves(); const first = Object.keys(MOVES).find(k => MOVES[k].cat === catKey); setMove(first); });
$('tempos').innerHTML = Object.entries(TEMPO).map(([k, t]) => `<button data-t="${k}">${t.name}</button>`).join('');
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tempoKey = b.dataset.t; renderTempo(); tl = buildTimeline(cur); clock = 0; });
function renderTempo(){
  const m = cur;

  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tempoKey));

}
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => setView(b.dataset.v));
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸ 暫停' : '▶ 播放'; };
$('scrub').oninput = () => { playing = false; $('play').textContent = '▶ 播放'; clock = $('scrub').value/1000*tl.dur; };
$('musBtn').onclick = () => { showMus = !showMus; $('musBtn').classList.toggle('on', showMus); if (skin) skin.sig = ''; };

function renderMis(){
  const m = cur;
  $('mis').innerHTML = `<button data-mi="-1" class="${misIdx < 0 ? 'on' : ''}">只睇正確</button>` + (m.mis || []).map((x, i) => `<button data-mi="${i}" class="${i === misIdx ? 'on' : ''}">❌ ${x.name}</button>`).join('');
  document.querySelectorAll('[data-mi]').forEach(b => b.onclick = () => {
    misIdx = +b.dataset.mi; cmpOn = misIdx >= 0; renderMis(); renderMuscles(null);
    const v = misIdx >= 0 ? misView(m.mis[misIdx]) : (m.view || 'side'); if (v) setView(v);
    fitCam();
  });
  const mi = misIdx >= 0 ? m.mis[misIdx] : null;
  $('misWhy').style.display = mi ? '' : 'none';
  if (mi) $('misWhy').innerHTML = `<b>❌ ${mi.name}</b>：${mi.why}`;
  $('lblR').textContent = mi ? '❌ ' + mi.name : '';
  ['lblL','lblR','divider'].forEach(id => $(id).style.display = cmpOn ? 'block' : 'none');
  stage.classList.toggle('cmp', cmpOn);
}
// best camera for seeing each kind of error
const FRONTAL = ['kneeIn','lean','hipDrop','shrug','flare','hipOut','hipOff','elbowBend','sway'], AXIAL = ['twist','hipYaw','follow'];
function misView(mi){
  if (mi.view) return mi.view;
  const ks = Object.keys(mi.d || {});
  if (ks.some(k => AXIAL.includes(k))) return 'top';
  if (ks.some(k => FRONTAL.includes(k))) return 'front';
  if (ks.length && !ks.includes('fast')) return 'side';
  return null;
}
function dots(n){ return '●'.repeat(n) + `<i>${'●'.repeat(3 - n)}</i>`; }
let lastMusSig = '';
function renderMuscles(s){
  const m = cur, mi = cmpOn && misIdx >= 0 ? m.mis[misIdx] : null;
  const lv = musLevels(m, mi);
  const rows = Object.entries(lv).filter(([, x]) => x.lv > 0 || x.delta).sort((a, b) => ((b[1].base ?? b[1].lv) - (a[1].base ?? a[1].lv)));
  const sig = rows.map(([k, x]) => k + x.lv + (s ? typeOf(x.role, s) : '')).join('|') + misIdx;
  if (sig === lastMusSig) return; lastMusSig = sig;
  $('musList').innerHTML = rows.map(([k, x]) => {
    const [base, side] = k.split('_'), ty = s ? typeOf(x.role, s) : 'rest', ph = PH[ty] || PH.rest;
    const b = x.base !== undefined ? x.base : x.lv;
    const d = x.delta ? `<span class="delta ${x.delta < 0 ? 'dn' : ''}">錯誤時 ${x.delta > 0 ? '多咗' : '少咗'}${Math.abs(x.lv - b) || ''}</span>` : '';
    return `<tr><td>${MUS[base]}${side ? `（${side === 'L' ? '左' : '右'}）` : ''}${x.role === 'iso' ? '<small>穩定肌：全程撐住</small>' : ''}</td><td><span class="dots">${dots(b)}</span> ${d}</td><td><span class="mode ${ph[1]}">${ph[0]}</span></td></tr>`;
  }).join('');
}
function setMove(id){
  curId = id; cur = MOVES[id]; catKey = cur.cat; misIdx = -1; cmpOn = false; pinned = null;
  renderMoves(); renderTempo(); renderMis();
  const m = cur;
  $('gear').textContent = m.gear || '';
  $('how').innerHTML = (m.how || []).map(x => `<li>${x}</li>`).join('');
  $('how').style.display = m.how ? '' : 'none';
  $('tDo').innerHTML = '✅ <b>要做：</b>' + m.do; $('tDont').innerHTML = '❌ <b>唔好：</b>' + m.dont; $('tStop').innerHTML = '🛑 <b>即刻停：</b>' + m.stop;
  $('tNote').textContent = m.note || '';
  $('refs').innerHTML = m.refs ? '🎬 對照示範：' + m.refs.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener" style="color:var(--accent)">${t}</a>`).join('・') : '';
  $('skiTxt').textContent = m.ski; $('sbTxt').textContent = m.sb;
  tl = buildTimeline(m); clock = 0; lastMusSig = '';
  setView(m.view || 'side');

  renderMuscles(null);
}
function prepMove(){
  const m = cur;
  const p0 = m.seq ? m.seq[0]._p : (m.startB ? m.B : m.A);
  if (m.pinHands){ pinned = null; const r = pose3D(p0); pinned = {L:r.o.handL.clone(), R:r.o.handR.clone()}; }
  const ref = pose3D(m.A || p0);
  if (m.props && (m.props.includes('sled') || m.props.includes('wallFront'))){ const rb = pose3D(m.B); ref.B = rb; }
  if (m.props && m.props.includes('bench')){ const a = pose3D(m.A); ref.bench = a.g.T.clone().add(new V(0, -.12, 0)); ref.bench.y = Math.max(.3, ref.bench.y); }

  const pts = [];
  for (let i = 0; i < 16; i++){
    const st = evalAt(m, tl, (i + .5)/16*tl.dur, null), r = pose3D(st.p, st.Tfix), o = r.o;
    pts.push(o.head, o.ankleL, o.ankleR, o.handL, o.handR, o.kneeL, o.kneeR, r.T, o.head.clone().add(new V(0, .12, 0)));
  }

  const box = new THREE.Box3().setFromPoints(pts); box.getCenter(target);

  fitCam();
}

/* ================= loop ================= */
let lastSize = '';
function resize(){ const w = stage.clientWidth, h = stage.clientHeight, k = w + 'x' + h; if (k !== lastSize){ renderer.setSize(w, h, false); lastSize = k; } return [w, h]; }
function renderOne(st, mis, x, w, h, H){
  const r = pose3D(st.p, st.Tfix);
  const qs = mis && mis.d && mis.d.range ? {q:st.q*mis.d.range} : st;
  props.forEach(f => f(r, qs));
  drawMuscles(cur, st, r.o, r.g, mis);
  placeCam(w/h);
  placeMark(mis ? mis.mark : null, r.o, r.g);
  renderer.setViewport(x, 0, w, h); renderer.setScissor(x, 0, w, h); renderer.render(scene, camera);
}
function frame(now){
  requestAnimationFrame(frame);

  if (!ready || !tl) return;
  if (playing) clock += dt;
  const [W, H] = resize();

  const st = evalAt(cur, tl, clock, null);
  if (cmpOn && misIdx >= 0){
    const mi = cur.mis[misIdx], st2 = evalAt(cur, tl, clock, mi);

    renderOne(st2, mi, Math.floor(W/2), W - Math.floor(W/2), H);
  } else renderOne(st, null, 0, W, H);
  if (playing) $('scrub').value = Math.round(st.tt/tl.dur*1000);
  // HUD
  const s = st.s, ph = PH[s.ph] || PH.rest, left = Math.max(0, s.d - (st.tt - s.t0));
  const say = s.say && !cur.hold ? '・' + s.say : '';
  $('hud').innerHTML = `<b>${cur.name}</b><br>${cur.hold ? '🔵 撐住（等長）・正常呼吸' : ph[2]}${say}<br><span style="color:#8b98a5">${cur.hold ? '' : '呢段 ' + s.d.toFixed(1) + ' 秒・一下共 ' + tl.dur.toFixed(1) + ' 秒'}</span><div id="phaseBar"><i style="width:${(st.u*100).toFixed(0)}%;background:${s.ph === 'con' ? '#3ddc84' : s.ph === 'ecc' ? '#ff4d6d' : s.ph === 'iso' ? '#4cc9f0' : '#6b7a88'}"></i></div>`;
  renderMuscles(s);
}

/* ================= boot ================= */
renderMoves();
setMove('leg_press');
Rig.load('xbot.json', fig, {color:0xb8c4d0}).then(R => {
  setupSkin(R); setupFingers(R);
  Rig.setHeight(1.75);
  const s = R.sM, rs = R.rest, len = k => R.len[k]*s;
  let minY = Infinity; for (const k in rs) minY = Math.min(minY, rs[k].p.y);
  LEN = {th:len('ulL'), sh:len('llL'), ua:len('arL'), fa:len('faL'), foot:len('ftL'),
    hw:Math.abs(rs.ulL.p.x - rs.ulR.p.x)/2*s, sw:Math.abs(rs.arL.p.x - rs.arR.p.x)/2*s,
    hipsUp:(rs.hips.p.y - (rs.ulL.p.y + rs.ulR.p.y)/2)*s, trunk:(rs.arL.p.y - rs.hips.p.y)*s, ankH:(rs.ftL.p.y - minY)*s};
  R.root.traverse(x => { if (x.isMesh) x.castShadow = true; });
  ready = true; $('loading').style.display = 'none';
  prepMove();
}).catch(e => { $('loading').textContent = '3D 模型載入失敗：' + e; });
requestAnimationFrame(frame);
window.__gym = {grip(ax, sgn){ GRIP_AXIS = new V(...ax); GRIP_SIGN = sgn; setGrip(true); }, skinInfo(){ if (!skin) return 'no skin'; const c = {}; skin.reg.forEach(r => c[r] = (c[r] || 0) + 1); return c; }, debugSkin(){ const P = [0xe6194b,0x3cb44b,0xffe119,0x4363d8,0xf58231,0x911eb4,0x46f0f0,0xf032e6,0xbcf60c,0xfabebe,0x008080,0xe6beff,0x9a6324,0x800000,0xaaffc3,0x808000,0x000075,0x808080,0xffd8b1]; const ks = Object.keys(MUS); for (let i = 0; i < skin.reg.length; i++){ const k = skin.reg[i]; const c = new THREE.Color(k ? P[ks.indexOf(k) % P.length] : 0xdddddd); skin.col.set([c.r, c.g, c.b], i*3); } skin.attr.needsUpdate = true; skin.debug = true; return ks.map((k, i) => k + ':' + P[i % P.length].toString(16)); }, MOVES, setMove, get cur(){ return cur; }, evalAt, get tl(){ return tl; }, pose3D, fk, get cam(){ return {target:target.toArray().map(x => +x.toFixed(2)), dist, az, el}; }};
})();
