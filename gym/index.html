<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 健身動作參考：肌肉・節奏・正確 vs 錯誤</title>
<style>
:root{--bg:#0f1419;--panel:#171e26;--line:#2a3440;--text:#e6edf3;--muted:#8b98a5;--accent:#4cc9f0;--good:#3ddc84;--warn:#ffb020;--con:#3ddc84;--ecc:#ff4d6d;--iso:#4cc9f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{padding:12px 16px 8px;max-width:900px;margin:0 auto}
h1{font-size:17px;margin:0}
header p{margin:2px 0 0;color:var(--muted);font-size:12px}
#stage{position:relative;height:58vh;min-height:330px;max-height:640px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#cfdbe6;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;top:8px;left:8px;z-index:2;background:rgba(15,20,25,.86);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none;max-width:70%;line-height:1.45}
.hud b{font-size:14px;color:var(--accent)}
.cmp .hud{max-width:47%;font-size:11px;padding:4px 7px}.cmp .hud b{font-size:12px}
#phaseBar{height:5px;background:#26303a;border-radius:3px;margin-top:5px;overflow:hidden}#phaseBar i{display:block;height:100%;width:0}
.cmpLbl{position:absolute;bottom:8px;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:600;pointer-events:none;display:none;max-width:48%}
#lblL{left:8px;background:rgba(61,220,132,.92);color:#0f1419}#lblR{right:8px;background:rgba(255,77,109,.94);color:#fff}
#divider{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#0f1419;display:none}
.hint{position:absolute;bottom:8px;right:8px;color:#3b4a58;font-size:10px;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3b4a58;font-size:13px;pointer-events:none}
main{padding:12px 16px 28px;max-width:900px;margin:0 auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%}
.seg button{padding:8px 2px;font-size:12px}
.seg button.on{background:var(--accent);color:#0f1419;font-weight:600}
.wrap{display:flex;flex-wrap:wrap;gap:6px}.wrap button{font-size:12px;padding:6px 9px}
.wrap button.on{background:var(--accent);color:#0f1419;font-weight:600}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 6px}
.card p{margin:4px 0;color:#c9d3dc}
.note{color:var(--muted)!important;font-size:12px}
.key{font-size:14px;padding:8px 10px;border-radius:8px;background:rgba(255,210,63,.1);border:1px solid rgba(255,210,63,.35)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:12px}
td small{display:block;color:var(--muted);font-size:11px;line-height:1.3}
.mode{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;white-space:nowrap}
.m-con{color:#0f1419;background:var(--con)}.m-ecc{color:#fff;background:var(--ecc)}.m-iso{color:#0f1419;background:var(--iso)}.m-off{color:var(--muted);background:#26303a}
.dots{letter-spacing:1px;color:var(--warn);white-space:nowrap}.dots i{color:#3a4652;font-style:normal}
.delta{color:var(--ecc);font-size:11px;font-weight:600}.delta.dn{color:var(--muted)}
ol.how{margin:4px 0 6px 18px;padding:0}ol.how li{margin:3px 0;color:#c9d3dc}
.tips p{padding-left:2px}
.sport{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start}
.sport b{white-space:nowrap}
.disc{color:var(--muted);font-size:11px;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>🏋️ 3D 健身動作參考</h1>
  <p>器械同滑雪／單板輔助動作：邊條肌肉發力、向心／離心／等長、節奏、正確 vs 錯誤</p>
</header>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="divider"></div>
  <div class="hud" id="hud"></div>
  <div class="cmpLbl" id="lblL">✅ 正確</div>
  <div class="cmpLbl" id="lblR"></div>
  <div id="loading">載入 3D 模型中…</div>
  <div class="hint">拖動旋轉・雙指縮放</div>
</div>

<main>
  <div class="row">
    <button id="play">⏸ 暫停</button>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <button id="musBtn" class="on">💪 肌肉</button>
  </div>
  <div class="seg" id="views" style="grid-template-columns:repeat(5,1fr)">
    <button data-v="side" class="on">側面</button><button data-v="diag">斜</button><button data-v="front">正面</button><button data-v="back">後面</button><button data-v="top">上面</button>
  </div>

  <div class="card">
    <div class="seg" id="cats"></div>
    <div class="wrap" id="moves" style="margin-top:10px"></div>
  </div>

  <div class="card" id="tempoCard">
    <h2>⏱ 節奏</h2>
    <div class="seg" id="tempos" style="grid-template-columns:repeat(3,1fr)"></div>
    <p id="tempoTxt"></p>
  </div>

  <div class="card">
    <h2>⇆ 正確 vs 錯誤</h2>
    <div class="wrap" id="mis"></div>
    <p id="misWhy" class="key" style="display:none;margin-top:8px"></p>
  </div>

  <div class="card">
    <h2>💪 邊度發力</h2>
    <p class="note"><span class="mode m-con">向心</span> 肌肉縮短發力・<span class="mode m-ecc">離心</span> 肌肉拉長仲要控制・<span class="mode m-iso">等長</span> 長度唔變撐住・●●● 越多越主力</p>
    <table><thead><tr><th>肌肉</th><th>主力</th><th>而家</th></tr></thead><tbody id="musList"></tbody></table>
  </div>

  <div class="card">
    <h2>📋 點做</h2>
    <p id="gear" class="note"></p>
    <ol class="how" id="how"></ol>
    <div class="tips">
      <p id="tDo"></p><p id="tDont"></p><p id="tStop"></p><p id="tNote" class="note"></p>
    </div>
  </div>

  <div class="card">
    <h2>⛷️🏂 滑雪點用得著</h2>
    <div class="sport"><b>⛷️ 雙板</b><span id="skiTxt"></span><b>🏂 單板</b><span id="sbTxt"></span></div>
  </div>

  <p class="disc">⚠️ 肌肉發力係根據運動生物力學原理做嘅示意（相對值），唔係實測 EMG。公仔動作係程式產生嘅理想化示範，用嚟理解做法同錯誤，唔係醫療或者復康建議；有痛就停，有傷患請先問醫生或者物理治療師。</p>
</main>

let fitBox = null;
function fitCam(){
  if (!fitBox) return;
  const size = fitBox.getSize(new V()), asp = Math.max(.4, (stage.clientWidth/(cmpOn ? 2 : 1))/stage.clientHeight), tf = Math.tan(19*D);
  const halfH = size.y/2 + .08, halfW = Math.max(size.x, size.z)/2 + .08;
  dist = clamp(Math.max(halfH/tf, halfW/(tf*asp))*1.2 + .45, 2.2, 9);
}
const VIEWS = {side:[90, 10], diag:[40, 14], front:[0, 8], back:[180, 10], top:[20, 68]};
let az = 90, el = 12, dist = 3.6, target = new V(0, .8, 0), viewKey = 'side';
function setView(v){ viewKey = v; [az, el] = VIEWS[v]; document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
function placeCam(aspect){
  camera.aspect = aspect; camera.updateProjectionMatrix();
  const a = az*D, e = el*D;
  camera.position.set(target.x + dist*Math.cos(e)*Math.sin(a), target.y + dist*Math.sin(e), target.z + dist*Math.cos(e)*Math.cos(a));
  camera.lookAt(target);
}
{ let drag = null, pinch = null;
  cv.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, az, el}; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (!drag || pinch) return; az = drag.az - (e.clientX - drag.x)*.4; el = clamp(drag.el + (e.clientY - drag.y)*.3, -5, 85); });
  cv.addEventListener('pointerup', () => drag = null);
  cv.addEventListener('wheel', e => { e.preventDefault(); dist = clamp(dist*(1 + e.deltaY*.001), 1.4, 8); }, {passive:false});
  cv.addEventListener('touchstart', e => { if (e.touches.length === 2){ pinch = {d:Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), dist}; drag = null; } }, {passive:true});
  cv.addEventListener('touchmove', e => { if (pinch && e.touches.length === 2){ const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); dist = clamp(pinch.dist*pinch.d/d, 1.4, 8); } }, {passive:true});
  cv.addEventListener('touchend', () => { pinch = null; });
}

function renderOne(st, mis, x, w, h, H){
  const r = pose3D(st.p, st.Tfix);

  drawMuscles(cur, st, r.o, r.g, mis);
  placeCam(w/h);
  placeMark(mis ? mis.mark : null, r.o, r.g);

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (!ready || !tl) return;
  if (playing) clock += dt;
  const [W, H] = resize();
  renderer.setScissorTest(true);
  const st = evalAt(cur, tl, clock, null);
  if (cmpOn && misIdx >= 0){
    const mi = cur.mis[misIdx], st2 = evalAt(cur, tl, clock, mi);
    renderOne(st, null, 0, Math.floor(W/2), H);

    hipsUp:(rs.hips.p.y - (rs.ulL.p.y + rs.ulR.p.y)/2)*s, trunk:(rs.arL.p.y - rs.hips.p.y)*s, ankH:(rs.ftL.p.y - minY)*s};
  R.root.traverse(x => { if (x.isMesh) x.castShadow = true; });
  Rig.setOpacity(.55);
  ready = true; $('loading').style.display = 'none';
  prepMove();
}).catch(e => { $('loading').textContent = '3D 模型載入失敗：' + e; });
requestAnimationFrame(frame);
window.__gym = {MOVES, setMove, get cur(){ return cur; }, evalAt, get tl(){ return tl; }, pose3D, fk, get cam(){ return {target:target.toArray().map(x => +x.toFixed(2)), dist, az, el}; }};
})();
