<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雪場實用技能：穿戴・吊椅・跌倒・規則</title>
<style>
:root{--bg:#0f1419;--card:#171e26;--line:#2a3440;--text:#e6edf3;--muted:#8b98a5;--accent:#4cc9f0;--ok:#22c55e;--bad:#ef4444;--warn:#ffb020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif}
header{max-width:720px;margin:0 auto;padding:16px 16px 0}
header h1{font-size:20px;margin:0}
header p{color:var(--muted);margin:4px 0 0;font-size:13px}
main{max-width:720px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.seg{display:grid;gap:4px}
.seg button,.wrap button,button{background:#0f1419;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:13px;cursor:pointer}
button.on{background:var(--accent);color:#0f1419;font-weight:600;border-color:var(--accent)}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.wrap button{padding:6px 10px}
h2{font-size:17px;margin:0 0 6px}
h3{font-size:15px;margin:10px 0 4px}
.note{color:var(--muted);font-size:12px;margin:6px 0 0}
.stepHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dots span.done{background:var(--ok)}
.dots span.cur{outline:2px solid var(--accent)}
svg.scene{width:100%;height:auto;background:#0b1016;border-radius:10px;display:block}
ul{margin:4px 0;padding-left:20px}
li{margin:2px 0}
.ok h3{color:var(--ok)} .bad h3{color:var(--bad)} .why h3{color:var(--warn)} .chk h3{color:var(--accent)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.nav button{padding:10px}
.quiz button{display:block;width:100%;text-align:left;margin:6px 0;padding:10px}
.quiz button.right{border-color:var(--ok)} .quiz button.wrong{border-color:var(--bad)}
.banner{border-left:3px solid var(--warn);padding:6px 10px;background:#1d1a12;border-radius:0;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <select id="langSel" aria-label="Language" style="float:right;margin-left:8px;background:#171e26;color:#e6edf3;border:1px solid #2a3440;border-radius:8px;padding:4px 6px;font-size:12px"><option value="index.html">廣東話（香港）</option><option value="zh-tw.html" selected>繁體中文（台灣）</option><option value="zh-cn.html">简体中文（中国大陆）</option><option value="en.html">English</option></select>
  <h1>🧭 雪場實用技能</h1>
  <p>出發前就要會：穿戴裝備、上下吊椅、跌倒起身、雪場規則。逐步看，每步有示意圖、正確做法和常見錯誤。</p>
</header>
<main>
  <div class="banner">每個雪場、每種纜車的做法都可能不同：一定以現場告示和工作人員指示為準。圖是示意，不是實際比例。</div>

  <div class="card" style="margin-top:12px">
    <div class="seg" id="mods" style="grid-template-columns:repeat(3,1fr)"></div>
    <div class="wrap" id="lessons" style="margin-top:10px"></div>
  </div>

  <div class="card" id="lessonCard">
    <div class="stepHead"><h2 id="stepTitle"></h2><span class="note" id="stepNo"></span></div>
    <div class="dots" id="dots"></div>
    <svg class="scene" id="scene" viewBox="0 0 320 190"></svg>
    <div class="ok"><h3>✅ 正確做法</h3><ul id="okList"></ul></div>
    <div class="bad"><h3>❌ 常見錯誤</h3><ul id="badList"></ul></div>
    <div class="why"><h3>⚠️ 為什麼重要</h3><p id="why" style="margin:0"></p></div>
    <div class="chk" id="chkBox"><h3>👌 自我檢查</h3><p id="chk" style="margin:0"></p></div>
    <div class="nav"><button id="prev">← 上一步</button><button id="next">下一步 →</button></div>
    <p class="note" id="progress"></p>
  </div>

  <div class="card" id="quizCard" style="display:none">
    <h2>🧩 情境題</h2>
    <p id="quizQ" style="margin:0"></p>
    <div class="quiz" id="quizA"></div>
    <p id="quizFb" style="margin:0"></p>
  </div>

  <p class="note">參考：日本各雪場乘車告示和安全守則、FIS 滑雪者行為守則、滑雪鞋廠商穿鞋指引。內容是給初學者的保守做法，不取代雪場規定和教練指導。</p>
</main>

<script>
const $ = id => document.getElementById(id);

/* ---------- scenes (simple SVG illustrations) ---------- */
const C = {skin:'#f1c9a5', base:'#60a5fa', mid:'#f59e0b', shell:'#ef4444', pants:'#334155', sock:'#e5e7eb', boot:'#94a3b8', helmet:'#10b981', goggle:'#a78bfa', glove:'#1e293b', neck:'#f472b6', hi:'#fde047', snow:'#dbe7f3', line:'#2a3440', chair:'#64748b', ski:'#4cc9f0', board:'#22d3ee'};

function figDress(upto){
  const hl = i => i === upto ? `stroke="${C.hi}" stroke-width="3"` : '';
  let s = `<rect x="0" y="170" width="320" height="20" fill="${C.snow}" opacity=".15"/>`;
  const x = 160;
  s += `<circle cx="${x}" cy="38" r="17" fill="${C.skin}"/>`;
  s += `<rect x="${x-22}" y="58" width="44" height="58" rx="10" fill="${C.skin}"/><rect x="${x-34}" y="60" width="12" height="52" rx="6" fill="${C.skin}"/><rect x="${x+22}" y="60" width="12" height="52" rx="6" fill="${C.skin}"/>`;
  s += `<rect x="${x-20}" y="112" width="17" height="56" rx="7" fill="${C.skin}"/><rect x="${x+3}" y="112" width="17" height="56" rx="7" fill="${C.skin}"/>`;
  if (upto >= 0) s += `<g ${hl(0)}><rect x="${x-22}" y="58" width="44" height="58" rx="10" fill="${C.base}"/><rect x="${x-34}" y="60" width="12" height="50" rx="6" fill="${C.base}"/><rect x="${x+22}" y="60" width="12" height="50" rx="6" fill="${C.base}"/><rect x="${x-20}" y="112" width="17" height="54" rx="7" fill="${C.base}"/><rect x="${x+3}" y="112" width="17" height="54" rx="7" fill="${C.base}"/></g>`;
  if (upto >= 1) s += `<g ${hl(1)}><rect x="${x-23}" y="59" width="46" height="54" rx="10" fill="${C.mid}"/><rect x="${x-35}" y="61" width="12" height="46" rx="6" fill="${C.mid}"/><rect x="${x+23}" y="61" width="12" height="46" rx="6" fill="${C.mid}"/></g>`;
  if (upto >= 2) s += `<g ${hl(2)}><rect x="${x-21}" y="104" width="42" height="64" rx="8" fill="${C.pants}"/><rect x="${x-25}" y="58" width="50" height="60" rx="11" fill="${C.shell}"/><rect x="${x-37}" y="60" width="13" height="50" rx="6" fill="${C.shell}"/><rect x="${x+24}" y="60" width="13" height="50" rx="6" fill="${C.shell}"/><line x1="${x}" y1="60" x2="${x}" y2="116" stroke="#0f1419" stroke-width="1.5"/></g>`;
  if (upto >= 3) s += `<g ${hl(3)}><rect x="${x-20}" y="150" width="17" height="18" rx="4" fill="${C.sock}"/><rect x="${x+3}" y="150" width="17" height="18" rx="4" fill="${C.sock}"/></g>`;
  if (upto >= 4) s += `<g ${hl(4)}><rect x="${x-24}" y="138" width="22" height="34" rx="5" fill="${C.boot}"/><rect x="${x+2}" y="138" width="22" height="34" rx="5" fill="${C.boot}"/>${[144,152,160,166].map(y => `<line x1="${x-24}" y1="${y}" x2="${x-2}" y2="${y}" stroke="#0f1419"/><line x1="${x+2}" y1="${y}" x2="${x+24}" y2="${y}" stroke="#0f1419"/>`).join('')}</g>`;
  if (upto >= 5) s += `<g ${hl(5)}><path d="M${x-19} 40 a19 20 0 0 1 38 0 z" fill="${C.helmet}"/><line x1="${x-14}" y1="44" x2="${x}" y2="56" stroke="${C.helmet}" stroke-width="2"/><line x1="${x+14}" y1="44" x2="${x}" y2="56" stroke="${C.helmet}" stroke-width="2"/></g>`;
  if (upto >= 6) s += `<g ${hl(6)}><rect x="${x-18}" y="35" width="36" height="11" rx="5" fill="${C.goggle}"/></g>`;
  if (upto >= 7) s += `<g ${hl(7)}><rect x="${x-39}" y="104" width="16" height="16" rx="5" fill="${C.glove}"/><rect x="${x+23}" y="104" width="16" height="16" rx="5" fill="${C.glove}"/></g>`;
  if (upto >= 8) s += `<g ${hl(8)}><rect x="${x-12}" y="50" width="24" height="10" rx="4" fill="${C.neck}"/></g>`;
  if (upto >= 9) s += `<text x="${x+50}" y="70" fill="${C.hi}" font-size="22">✓</text>`;
  const legend = ['底層','中層','外層','雪襪','雪鞋','頭盔','雪鏡','手套','護頸','全部檢查'];
  s += `<text x="12" y="22" fill="${C.hi}" font-size="12">${legend[upto]}</text>`;
  return s;
}

function figBoot(){
  // boot buckles numbered in a common order (makers differ)
  let s = `<g transform="translate(0,22)"><path d="M110 40 L190 40 L196 120 L230 128 L234 160 L96 160 L100 120 Z" fill="${C.boot}" stroke="#0f1419"/>`;
  const bk = [[150,62,'1'],[150,82,'2'],[178,118,'3'],[205,140,'4']];
  bk.forEach(([x, y, n]) => { s += `<rect x="${x-30}" y="${y-5}" width="60" height="10" rx="3" fill="#0f1419"/><circle cx="${x+40}" cy="${y}" r="9" fill="${C.hi}"/><text x="${x+40}" y="${y+4}" fill="#0f1419" font-size="11" text-anchor="middle">${n}</text>`; });
  s += `<rect x="108" y="30" width="84" height="10" rx="3" fill="${C.neck}"/><text x="200" y="38" fill="${C.neck}" font-size="11">strap</text></g>`;
  s += `<text x="12" y="18" fill="${C.hi}" font-size="11">常見順序：1 腳踝 → 2 上面</text><text x="12" y="34" fill="${C.hi}" font-size="11">→ 3、4 腳背和腳趾（不用太緊）→ strap</text>`;
  return s;
}

/* person: x = hip position, mode stand/sit/lie, gear ski/board */
function person(x, y, sit, gear, opt = {}){
  const col = opt.col || C.shell;
  let s = '';
  if (sit > .5){
    s += `<line x1="${x}" y1="${y-20}" x2="${x-4}" y2="${y-52}" stroke="${col}" stroke-width="9" stroke-linecap="round"/>`;
    s += `<circle cx="${x-5}" cy="${y-64}" r="9" fill="${C.helmet}"/>`;
    s += `<line x1="${x}" y1="${y-20}" x2="${x+24}" y2="${y-20}" stroke="${C.pants}" stroke-width="8" stroke-linecap="round"/><line x1="${x+24}" y1="${y-20}" x2="${x+26}" y2="${y+6}" stroke="${C.pants}" stroke-width="7" stroke-linecap="round"/>`;
    if (gear === 'none') {}
    else if (gear === 'ski') s += `<line x1="${x+8}" y1="${y+6}" x2="${x+56}" y2="${y+6-(opt.tips?8:0)}" stroke="${C.ski}" stroke-width="3"/>`;
    else s += `<line x1="${x+4}" y1="${y+8}" x2="${x+52}" y2="${y+8}" stroke="${C.board}" stroke-width="5" stroke-linecap="round"/>`;
    if (gear === 'ski' && opt.poles) s += `<line x1="${x+4}" y1="${y-34}" x2="${x+30}" y2="${y-36}" stroke="#cbd5e1" stroke-width="2"/>`;
  } else {
    const lean = opt.lean || 0;
    s += `<line x1="${x}" y1="${y-36}" x2="${x+lean}" y2="${y-66}" stroke="${col}" stroke-width="9" stroke-linecap="round"/>`;
    s += `<circle cx="${x+lean}" cy="${y-78}" r="9" fill="${C.helmet}"/>`;
    s += `<line x1="${x}" y1="${y-36}" x2="${x+3}" y2="${y-2}" stroke="${C.pants}" stroke-width="8" stroke-linecap="round"/>`;
    if (gear === 'none') {}
    else if (gear === 'ski'){ s += `<line x1="${x-22}" y1="${y}" x2="${x+30}" y2="${y-(opt.tips?6:0)}" stroke="${C.ski}" stroke-width="3"/>`; if (opt.poles) s += `<line x1="${x+lean+6}" y1="${y-52}" x2="${x+20}" y2="${y-2}" stroke="#cbd5e1" stroke-width="2"/>`; }
    else { s += `<line x1="${x-24}" y1="${y+1}" x2="${x+26}" y2="${y+1}" stroke="${C.board}" stroke-width="5" stroke-linecap="round"/>`; if (opt.rear !== 'on') s += `<line x1="${x-2}" y1="${y-30}" x2="${x-14}" y2="${y-2}" stroke="${C.pants}" stroke-width="7" stroke-linecap="round"/>`; }
  }
  return s;
}
function chair(x, y, bar, empty){
  let s = `<line x1="${x}" y1="22" x2="${x}" y2="${y-62}" stroke="${C.chair}" stroke-width="3"/>`;
  s += `<path d="M${x} ${y-62} L${x-8} ${y-62} L${x-8} ${y-20} L${x+26} ${y-20}" fill="none" stroke="${C.chair}" stroke-width="5"/>`;
  s += bar > .5 ? `<path d="M${x} ${y-62} L${x+30} ${y-50} L${x+30} ${y-12}" fill="none" stroke="${C.hi}" stroke-width="3"/>` : `<path d="M${x} ${y-62} L${x+10} ${y-80}" fill="none" stroke="${C.hi}" stroke-width="3"/>`;
  return s;
}
const lerp = (a, b, t) => a + (b - a)*t;
function liftScene(sp, t, gear){
  const g = sp.ground ?? 160;
  let s = `<line x1="0" y1="22" x2="320" y2="22" stroke="${C.chair}" stroke-width="2"/>`;
  s += sp.ramp ? `<path d="M0 ${g} L200 ${g} L320 ${g+20} L320 190 L0 190 Z" fill="${C.snow}" opacity=".18"/>` : `<rect x="0" y="${g}" width="320" height="${190-g}" fill="${C.snow}" opacity=".18"/>`;
  if (sp.marker) s += `<line x1="${sp.marker}" y1="${g}" x2="${sp.marker}" y2="${g-10}" stroke="${C.bad}" stroke-width="3"/><text x="${sp.marker-14}" y="${g+16}" fill="${C.bad}" font-size="10">${sp.markerTxt || '上車位'}</text>`;
  const cx = sp.chair ? lerp(sp.chair[0], sp.chair[1], t) : null;
  const bar = sp.bar ? lerp(sp.bar[0], sp.bar[1], t) : 0;
  let px = sp.p ? lerp(sp.p[0], sp.p[1], t) : null, sit = sp.sit ? (typeof sp.sit === 'number' ? sp.sit : sp.sit(t, cx)) : 0;
  if (sp.ride && cx != null && sit > .5) px = cx + 8;
  if (cx != null) s += chair(cx, g, bar, false);
  if (sp.chair2) s += chair(lerp(sp.chair2[0], sp.chair2[1], t), g, 0, true);
  if (px != null) s += person(px, sit > .5 ? g - 4 : (sp.py ?? g), sit, gear, {tips: sp.tips, poles: gear === 'ski', lean: sp.lean || 0, rear: sp.rear, col: sp.col});
  if (sp.down) s += `<g transform="translate(${sp.down[0]},${sp.down[1]})">${lying(gear)}</g>`;
  if (sp.staff) s += `<text x="${sp.staff}" y="${g-6}" font-size="18">🧑‍🔧</text>`;
  if (sp.label) s += `<text x="12" y="186" fill="${C.hi}" font-size="11">${sp.label}</text>`;
  return s;
}
function lying(gear){
  return `<line x1="0" y1="0" x2="34" y2="-4" stroke="${C.shell}" stroke-width="9" stroke-linecap="round"/><circle cx="44" cy="-6" r="9" fill="${C.helmet}"/><line x1="0" y1="0" x2="-26" y2="4" stroke="${C.pants}" stroke-width="8" stroke-linecap="round"/>` +
    (gear === 'none' ? '' : gear === 'ski' ? `<line x1="-40" y1="10" x2="0" y2="12" stroke="${C.ski}" stroke-width="3"/>` : `<line x1="-44" y1="10" x2="-4" y2="10" stroke="${C.board}" stroke-width="5"/>`);
}
function slopeScene(kind, t){
  // top view of a run: downhill is down the screen
  let s = `<rect x="40" y="0" width="240" height="190" fill="${C.snow}" opacity=".12"/><line x1="40" y1="0" x2="40" y2="190" stroke="${C.line}" stroke-width="3"/><line x1="280" y1="0" x2="280" y2="190" stroke="${C.line}" stroke-width="3"/><text x="316" y="184" fill="#8b98a5" font-size="10" text-anchor="end">↓ 下坡</text>`;
  const dot = (x, y, col, lab) => `<circle cx="${x}" cy="${y}" r="9" fill="${col}"/><text x="${x > 180 ? x-12 : x+12}" y="${y+4}" fill="${col}" font-size="11" text-anchor="${x > 180 ? 'end' : 'start'}">${lab}</text>`;
  if (kind === 'yield'){
    const ay = lerp(40, 130, t), bx = 150 + 40*Math.sin(t*6), by = lerp(90, 150, t);
    s += dot(bx, by, C.ok, '前面的人優先');
    s += dot(lerp(160, 230, Math.min(1, t*1.4)), ay, C.accent, '你（後面）：讓開對方');
    s += `<path d="M160 40 Q230 80 230 130" fill="none" stroke="${C.accent}" stroke-dasharray="4 4"/>`;
  } else if (kind === 'stop'){
    s += `<path d="M90 60 Q160 40 230 60" fill="none" stroke="${C.line}" stroke-width="10" opacity=".7"/><text x="120" y="35" fill="#8b98a5" font-size="10">坡頂／彎位（後面的人看不到你）</text>`;
    s += dot(160, 72, C.bad, '❌ 停在盲點');
    s += dot(266, 120, C.ok, '✅ 停在邊上、看得到的位置');
  } else if (kind === 'fall'){
    const x = lerp(160, 262, Math.max(0, t*1.3 - .2)), y = lerp(100, 110, t);
    s += `<text x="${x-14}" y="${y+5}" font-size="20">🧍</text><text x="${x+14}" y="${y+4}" fill="${C.hi}" font-size="11">${t < .25 ? '① 有沒有受傷？' : t < .8 ? '② 移到雪道邊' : '③ 安全位置再起身'}</text>`;
    s += dot(150, lerp(10, 60, t), C.accent, '後面下來的人');
  } else if (kind === 'start'){
    s += dot(260, 110, C.ok, '你：起步前');
    s += `<text x="190" y="90" fill="${C.hi}" font-size="18">👀↑</text>`;
    s += dot(lerp(110, 200, t), lerp(10, 100, t), C.accent, '上面正在下來');
  }
  return s;
}
function iconScene(kind, t){
  let s = `<rect x="0" y="160" width="320" height="30" fill="${C.snow}" opacity=".15"/>`;
  if (kind === 'gondola'){
    s += `<line x1="0" y1="30" x2="320" y2="30" stroke="${C.chair}" stroke-width="2"/>`;
    const x = lerp(60, 200, t);
    s += `<line x1="${x+30}" y1="30" x2="${x+30}" y2="58" stroke="${C.chair}" stroke-width="3"/><rect x="${x}" y="58" width="60" height="70" rx="12" fill="#1e293b" stroke="${C.accent}"/><rect x="${x+8}" y="66" width="44" height="26" rx="4" fill="#0b1016"/>`;
    s += `<rect x="${x+62}" y="60" width="6" height="60" fill="${C.ski}"/><text x="${x+72}" y="96" fill="${C.ski}" font-size="10">外面板架</text>`;
  } else if (kind === 'carpet'){
    s += `<path d="M20 160 L300 110 L300 120 L20 170 Z" fill="#334155"/>`;
    const x = lerp(40, 260, t), y = lerp(158, 118, t);
    s += person(x, y, 0, 'ski', {poles:true});
    s += `<text x="12" y="22" fill="${C.hi}" font-size="12">站穩、不要坐、不要走</text>`;
  } else if (kind === 'tbar'){
    s += `<line x1="0" y1="30" x2="320" y2="20" stroke="${C.chair}" stroke-width="2"/>`;
    const x = lerp(60, 230, t);
    s += `<line x1="${x}" y1="28" x2="${x-10}" y2="110" stroke="${C.chair}" stroke-width="3"/><line x1="${x-30}" y1="112" x2="${x+10}" y2="112" stroke="${C.hi}" stroke-width="5"/>`;
    s += person(x - 8, 160, 0, 'ski', {poles:true, lean:-4});
    s += `<text x="12" y="22" fill="${C.hi}" font-size="12">T 型拉索：靠著，不要坐下去</text>`;
  } else if (kind === 'standski' || kind === 'standboard'){
    const ski = kind === 'standski';
    s += `<path d="M0 170 L320 120 L320 190 L0 190 Z" fill="${C.snow}" opacity=".18"/><text x="250" y="110" fill="#8b98a5" font-size="10">↑ 上坡</text>`;
    const st = t < .34 ? 0 : t < .67 ? 1 : 2;
    if (ski){
      s += `<line x1="70" y1="168" x2="170" y2="150" stroke="${C.ski}" stroke-width="3"/><text x="40" y="186" fill="${C.ski}" font-size="10">雙板橫放斜坡、在下坡那一邊</text>`;
      s += st === 0 ? `<g transform="translate(130,140)">${lying('none')}</g>` : st === 1 ? person(120, 152, 1, 'none') : person(120, 152, 0, 'none', {lean:-6});
    } else {
      s += `<line x1="70" y1="168" x2="170" y2="150" stroke="${C.board}" stroke-width="5"/><text x="40" y="186" fill="${C.board}" font-size="10">板子橫放斜坡、在下坡那一邊</text>`;

  {t:'雙板：跌倒的時候', sc:{icon:'standski'}, ok:['失去平衡就順勢坐到側邊','雙腳併攏、手放前面','不要硬撐站回來'], bad:['手向後撐','髖跌到膝蓋以下還硬撐'], why:'向後跌硬撐是滑雪前十字韌帶斷裂最常見的原因。', chk:'練習時在平地慢慢坐到側邊。'},
  {t:'單板：跌倒的時候', sc:{icon:'standboard'}, ok:['手握拳收在身邊','向前跌：膝蓋和前臂一起著地','向後跌：收下巴，屁股和背部大面積著地'], bad:['伸直手用手掌撐地','後腦撞地'], why:'單板新手最常見的是手腕受傷，以及向後跌撞到頭。', chk:'先在緩坡慢速練習跌倒。'}
 ]},
 {mod:'fall', k:'getUp', n:'跌倒後起身', steps:[

  {t:'單板起身', sc:{icon:'standboard'}, ok:['坐著（heelside）：板子打橫在下坡，手撐起站','或轉身跪下（toeside）再站起，新手通常比較容易'], bad:['板子指著下坡就起身','在雪道中間慢慢坐著扣腳'], why:'板子一指向下坡就會馬上滑。', chk:'板子打橫斜坡再起身。'},
  {t:'移到雪道邊', sc:{slope:'fall'}, ok:['先確認自己有沒有受傷','能動就盡快移到雪道邊','受傷或動不了：請人通知巡邏隊'], bad:['坐在雪道中間休息','坐在坡頂、彎位、窄位'], why:'後面的人可能看不到你。', chk:'停在雪道邊、上面的人看得到的位置。'}
 ]},
 {mod:'rules', k:'etiquette', n:'雪場規則', quiz:true, steps:[
  {t:'前面的人優先', sc:{slope:'yield'}, ok:['前面（下面）的人有優先權','你在後面，要選一條不會危及對方的路線','超越時留足夠距離'], bad:['貼著前面的人超越','以為前面的人會讓你'], why:'前面的人看不到後面，隨時會轉彎。', chk:'超越時和對方保持幾個身位。'},
  {t:'停在哪裡', sc:{slope:'stop'}, ok:['停在雪道邊、上面看得到的位置'], bad:['停在坡頂後面、彎位、窄位','一群人橫排停在雪道中間'], why:'在盲點停下，上面下來的人看不到你。', chk:'從上面看下來看得到你嗎？'},
  {t:'起步和橫越前', sc:{slope:'start'}, ok:['起步或橫越雪道前先看上面','確認沒有人正在下來再出發'], bad:['不看就起步'], why:'上面下來的人速度比你快。', chk:'看一看上面再動。'},
  {t:'其他規則', sc:{slope:'yield'}, ok:['控制速度和路線，在看得到的範圍內停得下來','注意標示和封閉區','步行上下要走雪道邊','看到意外要幫忙、留下聯絡資料','單板要用流止帶'], bad:['進入封閉區','雪板或雪杖放在人流位置'], why:'這些是國際滑雪總會（FIS）行為守則和日本雪場常見規定。', chk:'不確定就問工作人員或巡邏隊。'}
 ]}
];
const QUIZ = {q:'你在雪道中間跌倒了，下一步該怎麼做？', a:[
  ['馬上站起來繼續滑', false, '先別急：要確認自己有沒有受傷，而且你在雪道中間，後面的人可能看不到你。'],
  ['先確認有沒有受傷，能動就移到雪道邊，受傷就請人通知巡邏隊', true, '對：確認傷勢 → 移到雪道邊安全位置 → 受傷或動不了就通知巡邏隊。'],
  ['坐在原地休息一下', false, '在雪道中間坐下，上面下來的人很容易撞到你。'],
  ['揮手叫後面的人停下', false, '後面的人未必看得到或停得及；最安全是自己移到雪道邊。']]};

/* ---------- state ---------- */
let modKey = 'gear', les = LESSONS[0], step = 0, t0 = performance.now();
let done = {}; try { done = JSON.parse(localStorage.getItem('resortDone') || '{}'); } catch(e){}
const save = () => { try { localStorage.setItem('resortDone', JSON.stringify(done)); } catch(e){} };

$('mods').innerHTML = MODS.map(([k, n]) => `<button data-mod="${k}">${n}</button>`).join('');
document.querySelectorAll('[data-mod]').forEach(b => b.onclick = () => { modKey = b.dataset.mod; setLesson(LESSONS.find(l => l.mod === modKey)); });
function renderLessons(){
  document.querySelectorAll('[data-mod]').forEach(b => b.classList.toggle('on', b.dataset.mod === modKey));
  $('lessons').innerHTML = LESSONS.filter(l => l.mod === modKey).map(l => {
    const n = l.steps.filter((_, i) => done[l.k + i]).length;
    return `<button data-les="${l.k}" class="${l === les ? 'on' : ''}">${l.n} <span class="note">${n}/${l.steps.length}</span></button>`;
  }).join('');
  document.querySelectorAll('[data-les]').forEach(b => b.onclick = () => setLesson(LESSONS.find(l => l.k === b.dataset.les)));
}
function setLesson(l){ les = l; modKey = l.mod; step = 0; renderLessons(); renderStep(); }
function renderStep(){
  const s = les.steps[step];
  done[les.k + step] = 1; save();
  $('stepTitle').textContent = s.t;
  $('stepNo').textContent = '第 {n}／{m} 步'.replace('{n}', step + 1).replace('{m}', les.steps.length);
  $('dots').innerHTML = les.steps.map((_, i) => `<span class="${done[les.k + i] ? 'done' : ''} ${i === step ? 'cur' : ''}"></span>`).join('');
  $('okList').innerHTML = s.ok.map(x => `<li>${x}</li>`).join('');
  $('badList').innerHTML = s.bad.map(x => `<li>${x}</li>`).join('');
  $('why').textContent = s.why;
  $('chk').textContent = s.chk;
  $('prev').disabled = false; $('next').disabled = false;
  $('prev').style.opacity = step === 0 ? .4 : 1; $('next').style.opacity = step === les.steps.length - 1 ? .4 : 1;
  const total = LESSONS.reduce((a, l) => a + l.steps.length, 0), got = Object.keys(done).length;
  $('progress').textContent = '全部完成度：{a}／{b} 步（只記錄在你的裝置）'.replace('{a}', Math.min(got, total)).replace('{b}', total);
  $('quizCard').style.display = les.quiz ? '' : 'none';
  renderLessons(); t0 = performance.now();
}
$('prev').onclick = () => { if (step > 0){ step--; renderStep(); } };
$('next').onclick = () => { if (step < les.steps.length - 1){ step++; renderStep(); } };

$('quizQ').textContent = QUIZ.q;
$('quizA').innerHTML = QUIZ.a.map(([txt], i) => `<button data-q="${i}">${txt}</button>`).join('');
document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
  const [, right, fb] = QUIZ.a[+b.dataset.q];
  document.querySelectorAll('[data-q]').forEach(x => x.classList.remove('right', 'wrong'));
  b.classList.add(right ? 'right' : 'wrong');
  $('quizFb').textContent = (right ? '✅ ' : '❌ ') + fb;
});

function frame(now){
  const s = les.steps[step], sc = s.sc, t = ((now - t0)/2600) % 1;
  let svg = '';
  if (sc.dress !== undefined) svg = figDress(sc.dress);
  else if (sc.boot) svg = figBoot();
  else if (sc.lift) svg = liftScene(sc.lift, t, les.gear || 'ski');
  else if (sc.slope) svg = slopeScene(sc.slope, t);
  else if (sc.icon) svg = iconScene(sc.icon, t);
  $('scene').innerHTML = svg;
  requestAnimationFrame(frame);
}
setLesson(LESSONS[0]);
requestAnimationFrame(frame);
</script>
<script>
(function(){
  var file = location.pathname.split('/').pop() || 'index.html';
  var sel = document.getElementById('langSel');
  if (sel) sel.onchange = function(){ try { localStorage.setItem('lang', sel.value); } catch(e){} location.href = sel.value; };
  if (file !== 'index.html' && file !== '') return;
  var saved = null; try { saved = localStorage.getItem('lang'); } catch(e){}
  var target = saved;
  if (!target){
    var l = (navigator.language || '').toLowerCase();
    if (/^zh-(hk|mo)/.test(l) || /yue/.test(l)) target = 'index.html';
    else if (/^zh-(tw|hant)/.test(l)) target = 'zh-tw.html';
    else if (/^zh/.test(l)) target = 'zh-cn.html';
  }
  if (target && target !== 'index.html') location.replace(target);
})();
</script>
